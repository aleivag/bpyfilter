[build-system]
requires = ["setuptools>=64", "Cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "bpyfilter"
version = "0.2.0"
description = "Python bindings for bpfilter 0.8: BPF-based packet filtering, from Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }   # links libbpfilter, which is GPL-2.0-only

[tool.setuptools]
packages = ["bpyfilter"]

[tool.setuptools.package-data]
bpyfilter = ["*.pxd", "*.pyx"]
